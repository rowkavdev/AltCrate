name: Build Linux Tauri

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build and smoke-test the Linux x64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tauri/casepilot/package.json
          cache: true
          cache_dependency_path: |
            tauri/casepilot/pnpm-lock.yaml
            tauri/runtime/pnpm-lock.yaml
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev xdg-utils dbus-x11 xvfb xauth
      - run: rustup update stable && rustup default stable
      - run: pnpm --dir tauri/runtime install --frozen-lockfile
      - run: pnpm --dir tauri/casepilot install --frozen-lockfile
      - name: Build the Debian package
        run: npm run package:linux -- --ci -- --locked
      - name: Run Rust unit tests
        run: cargo test --locked --release --manifest-path tauri/casepilot/src-tauri/Cargo.toml
      - name: Install and smoke-test the package
        env:
          CASEPILOT_FIXTURE: "1"
          CASEPILOT_VERIFY_EXIT: "1"
          CASEPILOT_VERIFY_UI: ${{ runner.temp }}/altcrate-linux
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          package="$(find "$PWD/tauri/casepilot/src-tauri/target/release/bundle/deb" -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          test "$(dpkg-deb -f "$package" Package)" = alt-crate
          test "$(dpkg-deb -f "$package" Replaces)" = case-pilot
          test "$(dpkg-deb -f "$package" Conflicts)" = case-pilot
          sudo apt-get install -y --no-install-recommends "$package"
          test -x /usr/bin/casepilot-node
          mkdir -p "$CASEPILOT_VERIFY_UI"
          timeout 120s dbus-run-session -- xvfb-run --auto-servernum /usr/bin/altcrate \
            > "$CASEPILOT_VERIFY_UI/launch.log" 2>&1 || {
              cat "$CASEPILOT_VERIFY_UI/launch.log"
              exit 1
            }
          jq -e '.passed == true and (.pages | length == 13) and .nativeLoginIsolation == true' \
            "$CASEPILOT_VERIFY_UI/native-report.json"
      - name: Verify upgrade from CasePilot 0.4.0
        env:
          CASEPILOT_FIXTURE: "1"
          CASEPILOT_VERIFY_EXIT: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          VERIFY_ROOT: ${{ runner.temp }}/altcrate-linux
        run: |
          mkdir -p "$VERIFY_ROOT/upgrade"
          bash tauri/scripts/verify-linux-upgrade.sh "$VERIFY_ROOT/upgrade"
      - name: Upload Linux verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altcrate-linux-verification
          path: ${{ runner.temp }}/altcrate-linux/
          retention-days: 7
      - name: Upload the Linux release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altcrate-linux-amd64
          path: tauri/casepilot/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
