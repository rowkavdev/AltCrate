name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        ## Do not paste credentials

        **Never** include cookies, session tokens, passwords, or account data when describing desired behaviour.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What workflow is painful or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Tauri UI (web)
        - Engine / runtime
        - Tauri packaging
        - Legacy Electron
        - Legacy Qt
        - Unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you thought about

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I understand features must not require sharing live credentials in issues or PRs
          required: true
