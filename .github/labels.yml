- name: "area:tauri"
  color: "0052cc"
  description: Tauri desktop shell and packaging

- name: "area:electron-legacy"
  color: "6f42c1"
  description: Legacy Electron tree

- name: "area:qt-legacy"
  color: "8250df"
  description: Legacy Qt tree

- name: "area:repo"
  color: "5319e7"
  description: Repository configuration or workflow

# Platform & meta
- name: "platform:linux"
