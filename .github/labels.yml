# Type
- name: type:bug
  color: "d73a4a"
  description: Something is not working as expected

- name: type:feature
  color: "a2eeef"
  description: New capability or enhancement

- name: type:chore
  color: "cfd3d7"
  description: Maintenance, tooling, or non-user-facing work

- name: type:docs
  color: "0075ca"
  description: Documentation and manual verification

# Priority
- name: priority:high
  color: "b60205"
  description: Urgent or blocking issue

- name: priority:medium
  color: "fbca04"
  description: Important but not blocking

- name: priority:low
  color: "0e8a16"
  description: Nice to have or minor impact

# Area
- name: "area:ui"
